name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6.0'
      - name: Unit and fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Offline validation
        run: python3 scripts/validate-plugin.py --offline
      - name: Live capability validation
        run: python3 scripts/validate-plugin.py --live
